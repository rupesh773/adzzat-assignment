<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal-Bench Tasks</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#5d6678; --accent:#2f5fd0; --line:#e1e5ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1c2029; --text:#e8ebf2; --muted:#9aa3b5; --accent:#7aa2ff; --line:#2b3140; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { margin:0; font-size:1.25rem; }
  main { display:grid; grid-template-columns: 300px 1fr; gap:20px; padding:20px 24px; max-width:1100px; margin:auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .item { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:10px; background:var(--card);
          border:1px solid var(--line); border-radius:10px; color:inherit; cursor:pointer; font:inherit; }
  .item.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .badge { display:inline-block; margin-top:6px; padding:2px 8px; border-radius:99px; font-size:.75rem;
           background:var(--bg); color:var(--accent); border:1px solid var(--line); }
  .detail { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 24px; }
  .detail h2 { margin-top:0; }
  .detail h3 { margin:22px 0 6px; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .text { white-space:pre-wrap; line-height:1.55; }
  .note { border-left:3px solid var(--accent); padding-left:12px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header><h1>Terminal-Bench Tasks</h1></header>
<main>
  <nav id="list" aria-label="Tasks"><p class="muted">Loading…</p></nav>
  <section class="detail" id="detail"><p class="muted">Select a task.</p></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const block = (title, text, cls="") => text ? `<h3>${title}</h3><div class="text ${cls}">${esc(text)}</div>` : "";

function show(t) {
  document.querySelectorAll(".item").forEach(b => b.classList.toggle("active", b.dataset.id === t.id));
  document.getElementById("detail").innerHTML =
    `<h2>${esc(t.title)}</h2><span class="badge">${esc(t.type)}</span> <span class="badge">${esc(t.difficulty)}</span>` +
    block("Statement", t.statement) + block("Environment", t.environment) +
    block("Difficulty note", t.difficulty_note) +
    block("Grader shortcut prevention", t.shortcut_prevention, "note");
}

fetch("/api/tasks").then(r => r.json()).then(tasks => {
  const list = document.getElementById("list");
  list.innerHTML = "";
  tasks.forEach(t => {
    const b = document.createElement("button");
    b.className = "item"; b.dataset.id = t.id;
    b.innerHTML = `<strong>${esc(t.title)}</strong><br><span class="badge">${esc(t.type)}</span>`;
    b.onclick = () => show(t);
    list.appendChild(b);
  });
  if (tasks.length) show(tasks[0]);
}).catch(() => { document.getElementById("list").innerHTML = '<p class="muted">Could not load tasks.</p>'; });
</script>
</body>
</html>
