version = "1.0"

[metadata]
author_name = "Your Name"
difficulty = "medium"
category = "data-processing"
task_type = "outcome-driven"
title = "Summarise a messy server log"
tags = ["jsonl", "data-cleaning", "deduplication"]
shortcut_prevention = "The grader checks /app/summary.json against exact counts computed independently from a private pristine copy of the log, enforces the exact schema (no extra keys, integer counts), verifies the input log was not edited, and cross-checks that duplicate, tie and malformed-line edge cases are handled (e.g. totals equal the number of distinct valid request_ids)."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
